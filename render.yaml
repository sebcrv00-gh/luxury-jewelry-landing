envVarGroups:
  - name: luxury-jewelry-secrets
    envVars:
      - key: DB_HOST
        value: ""
      - key: DB_USER
        value: ""
      - key: DB_PASS
        value: ""
      - key: DB_NAME
        value: ""
      - key: DB_PORT
        value: ""
      - key: SESSION_SECRET
        value: "luxury_jewelry_secret_key_2026"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: ""
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: ""
      - key: SMTP_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: SMTP_GREETING_TIMEOUT_MS
        value: "10000"
      - key: SMTP_SOCKET_TIMEOUT_MS
        value: "15000"
      - key: ADMIN_CONTACT_EMAIL
        value: ""
      - key: FRONTEND_URL
        value: "https://luxury-jewelry-frontend.onrender.com"
      - key: WOMPI_PUBLIC_KEY
        value: ""
      - key: WOMPI_INTEGRITY_SECRET
        value: ""
      - key: WOMPI_CURRENCY
        value: "COP"
      - key: WOMPI_REDIRECT_URL
        value: "https://luxury-jewelry-frontend.onrender.com/checkout"
      - key: RECOVERY_CODE_TTL_MINUTES
        value: "10"

services:
  # Backend
  - type: web
    name: luxury-jewelry-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - fromGroup: luxury-jewelry-secrets

  # Frontend
  - type: web
    name: luxury-jewelry-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: /api
      - key: VITE_WOMPI_PUBLIC_KEY
        value: ""
      - key: VITE_WOMPI_CURRENCY
        value: "COP"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://luxury-jewelry-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
