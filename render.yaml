envVarGroups:
  - name: luxury-jewelry-secrets
    envVars:
      - key: DB_HOST
        value: ""
      - key: DB_USER
        value: ""
      - key: DB_PASS
        value: ""
      - key: DB_NAME
        value: ""
      - key: DB_PORT
        value: ""
      - key: SESSION_SECRET
        value: "luxury_jewelry_secret_key_2026"
      - key: EMAIL_USER
        value: ""
      - key: EMAIL_PASS
        value: ""
      - key: FRONTEND_URL
        value: "https://luxury-jewelry-frontend.onrender.com"

services:
  # Backend
  - type: web
    name: luxury-jewelry-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - fromGroup: luxury-jewelry-secrets

  # Frontend
  - type: web
    name: luxury-jewelry-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://luxury-jewelry-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
