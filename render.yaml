services:
  # Backend
  - type: web
    name: luxury-jewelry-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - fromGroup: luxury-jewelry-secrets

  # Frontend
  - type: static_site
    name: luxury-jewelry-frontend
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://luxury-jewelry-api.onrender.com/api
      # Nota: Render static sites usually need the full URL if not using a rewrite.
      # We'll set VITE_API_URL manually in the UI if this shortcut doesn't suffice.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://luxury-jewelry-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
