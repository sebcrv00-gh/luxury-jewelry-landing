services:
  # Backend
  - type: web
    name: luxury-jewelry-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - fromGroup: luxury-jewelry-secrets

static_sites:
  # Frontend
  - name: luxury-jewelry-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://luxury-jewelry-api.onrender.com/api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://luxury-jewelry-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
